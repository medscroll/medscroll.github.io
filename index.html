<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Segoe UI',Roboto,sans-serif; background:#0d1117; color:#e6f1ff; padding:16px; padding-bottom:80px; }

h1 { color:#00ff88; font-size:22px; margin-bottom:4px; }
.sub { color:#888; font-size:13px; margin-bottom:16px; }

.search-row { display:flex; gap:8px; align-items:center; position:sticky; top:0; z-index:100; background:#0d1117; padding:8px 0 16px 0; }
.search-row .search-bar { flex:1; position:static; padding:0; }
.search-bar input { width:100%; padding:14px 18px; border-radius:14px; border:1px solid #21262d; background:#161b22; color:#fff; font-size:15px; outline:none; }
.search-bar input:focus { border-color:#00ff88; }

.btn-decouvrir { flex-shrink:0; width:48px; height:48px; border-radius:14px; background:linear-gradient(135deg,#1a2332,#161b22); border:1px solid #2a3444; color:#00ccff; font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center; position:relative; transition:all 0.2s; }
.btn-decouvrir:active { transform:scale(0.94); background:#00ccff; color:#121212; }
.btn-decouvrir .badge { position:absolute; top:-4px; right:-4px; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:#ff6666; color:#fff; font-size:10px; font-weight:bold; display:none; align-items:center; justify-content:center; line-height:1; }
.btn-decouvrir.has-new .badge { display:flex; }

.cats { display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; scrollbar-width:none; }
.cats::-webkit-scrollbar { display:none; }
.cat-tab { flex-shrink:0; padding:10px 16px; border-radius:20px; background:#161b22; color:#ccc; border:1px solid #21262d; font-size:13px; cursor:pointer; white-space:nowrap; }
.cat-tab.active { background:#00ff88; color:#121212; font-weight:bold; border-color:#00ff88; }

.cours { background:#161b22; border-radius:14px; padding:14px; margin-bottom:10px; border:1px solid #21262d; display:flex; align-items:center; gap:12px; }
.cours .ico { font-size:32px; flex-shrink:0; }
.cours .info { flex:1; min-width:0; }
.cours .titre { font-weight:bold; font-size:15px; margin-bottom:2px; }
.cours .desc { font-size:12px; color:#8b949e; margin-bottom:4px; }
.cours .meta { display:flex; gap:10px; font-size:11px; color:#666; }
.cours .meta .niveau { color:#ffaa00; }
.cours .etat { font-size:10px; margin-top:4px; }
.cours .etat.ok { color:#00ff88; }
.cours .etat.maj { color:#ffaa00; }
.cours .etat.warn { color:#ff6666; }
.cours .actions { display:flex; flex-direction:column; gap:4px; flex-shrink:0; }
.cours button { padding:6px 10px; border-radius:6px; border:none; font-size:11px; font-weight:bold; cursor:pointer; white-space:nowrap; }
.btn-dl { background:#00ff88; color:#121212; }
.btn-maj { background:#ffaa00; color:#121212; }
.btn-lire { background:#0099ff; color:#fff; }
.btn-ligne { background:#4a4a8a; color:#fff; }
.btn-supp { background:#3a1a1a; color:#ff6666; padding:6px 8px !important; }

.progress { position:fixed; bottom:0; left:0; right:0; background:#161b22; padding:10px; text-align:center; font-size:11px; color:#8b949e; border-top:1px solid #21262d; }
.progress.ok { color:#00ff88; }
.progress.err { color:#ff6666; }
.empty { text-align:center; color:#666; padding:30px; }

#decouvertesOverlay { display:none; position:fixed; inset:0; z-index:99999; background:#0d1117; overflow-y:auto; padding:16px; }
#decouvertesOverlay .dec-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; max-width:500px; margin-left:auto; margin-right:auto; }
#decouvertesOverlay .dec-header h1 { color:#00ff88; font-size:22px; margin:0; }
#decouvertesOverlay .dec-close { padding:8px 16px; background:#161b22; color:#fff; border:1px solid #21262d; border-radius:20px; cursor:pointer; font-size:14px; }
#decouvertesOverlay .dec-intro { color:#888; font-size:12px; margin-bottom:16px; max-width:500px; margin-left:auto; margin-right:auto; }
#promosListe { max-width:500px; margin:0 auto; }
.promo-card { background:#161b22; border-radius:14px; padding:16px; margin-bottom:12px; border:1px solid #21262d; }
.promo-card .promo-head { display:flex; gap:12px; align-items:flex-start; }
.promo-card .promo-ico { width:56px; height:56px; border-radius:12px; flex-shrink:0; display:flex; align-items:center; justify-content:center; background:#0d1117; border:1px solid #21262d; overflow:hidden; font-size:32px; }
.promo-card .promo-ico img { width:100%; height:100%; object-fit:cover; border-radius:11px; }
.promo-card .promo-body { flex:1; min-width:0; }
.promo-card .promo-titre { font-weight:bold; font-size:15px; margin-bottom:4px; }
.promo-card .promo-desc { font-size:12px; color:#8b949e; margin-bottom:8px; line-height:1.5; }
.promo-card .promo-meta { font-size:11px; color:#666; margin-bottom:10px; }
.promo-card .promo-lien { display:inline-block; padding:8px 16px; background:#00ccff; color:#121212; text-decoration:none; border-radius:20px; font-weight:bold; font-size:12px; }
.promo-card .promo-badge { display:inline-block; padding:2px 8px; border-radius:10px; background:rgba(0,204,255,0.15); color:#00ccff; font-size:10px; font-weight:bold; margin-left:6px; vertical-align:middle; }
</style>

<body>

<h1>📚 STUDIA</h1>
<p class="sub">Apprendre autrement</p>

<div class="search-row">
    <div class="search-bar">
        <input type="text" id="search" placeholder="🔍 Rechercher un cours..." oninput="filtrer()">
    </div>
    <button class="btn-decouvrir" id="btnDecouvrir" onclick="ouvrirDecouvertes()" title="Découvertes">
        ✨
        <span class="badge" id="badgePromos"></span>
    </button>
</div>

<div class="cats" id="cats"></div>
<div id="liste"></div>
<p class="progress" id="progress">Chargement...</p>

<!-- OVERLAY DÉCOUVERTES -->
<div id="decouvertesOverlay">
    <div class="dec-header">
        <h1>✨ Découvertes</h1>
        <button class="dec-close" onclick="fermerDecouvertes()">✕</button>
    </div>
    <p class="dec-intro">Recommandations sélectionnées — aucun suivi, aucune donnée collectée.</p>
    <div id="promosListe">
        <p style="color:#666;text-align:center;padding:30px;">Chargement...</p>
    </div>
</div>

<script>
/* ═══════════ SERVICE WORKER ═══════════ */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(e => console.error('SW:', e));
    });
}
</script>

<script>
/* ═══════════ CONFIG ═══════════ */
var CATALOGUE_URL = 'https://medscroll.github.io/catalogue.json';
var BASE_URL = 'https://medscroll.github.io/';
var PROMOS_URL = 'https://medscroll.github.io/promos.json';
var PROMOS_CACHE = 'studia-promos-v1';
var APP_SOURCE = 'studia';

/* ═══════════ STOCKAGE — CACHE API ═══════════ */
var CoursStorage = {
    COURS_CACHE: 'studia-cours-v1',
    async _c() { return caches.open(this.COURS_CACHE); },
    async exists(f) {
        var c = await this._c();
        return !!(await c.match(BASE_URL + f, { ignoreSearch: true }));
    },
    async download(url, f) {
        try {
            var r = await fetch(url, { cache: 'no-store' });
            if (!r.ok) throw new Error('HTTP ' + r.status);
            var c = await this._c();
            await c.put(url, r.clone());
            return true;
        } catch (e) { console.error('DL err:', e.message); return false; }
    },
    async delete(f) {
        try { var c = await this._c(); await c.delete(BASE_URL + f, { ignoreSearch: true }); } catch (e) {}
    },
    async getVersion(id) { return parseInt(localStorage.getItem('studia_v_' + id) || '0'); },
    async setVersion(id, v) { localStorage.setItem('studia_v_' + id, v.toString()); }
};

/* ═══════════ ÉTAT GLOBAL ═══════════ */
var CATALOGUE = null;
var CATEGORIE_ACTIVE = 'toutes';
var telechargementsEnCours = {};
var recherche = '';

/* ═══════════ CHARGEMENT ═══════════ */
function charger() {
    try {
        var cached = localStorage.getItem('catalogue_cache');
        if (cached) { CATALOGUE = JSON.parse(cached); afficherTout(); }
    } catch(e) {}
    if (!navigator.onLine) {
        setProgress(CATALOGUE ? '⚠ Hors ligne - cache' : '⚠ Hors ligne', '');
        return;
    }
    setProgress('Chargement...', '');
    fetch(CATALOGUE_URL + '?t=' + Date.now())
        .then(r => r.json())
        .then(data => {
            CATALOGUE = data;
            try { localStorage.setItem('catalogue_cache', JSON.stringify(data)); } catch(e) {}
            afficherTout();
            setProgress('✓ Catalogue à jour', 'ok');
        })
        .catch(e => setProgress(CATALOGUE ? '⚠ Cache utilisé' : '⚠ Pas de connexion', 'err'));
}

function setProgress(txt, cls) {
    var p = document.getElementById('progress');
    p.textContent = txt;
    p.className = 'progress ' + (cls || '');
}

/* ═══════════ AFFICHAGE ═══════════ */
function afficherTout() {
    if (!CATALOGUE) return;
    try {
        var s = JSON.parse(localStorage.getItem('studia_section') || 'null');
        if (s && s.cat) CATEGORIE_ACTIVE = s.cat;
    } catch(e) {}
    afficherOnglets();
    afficherListe();
}

function sauverSection() {
    try { localStorage.setItem('studia_section', JSON.stringify({ cat: CATEGORIE_ACTIVE })); } catch(e) {}
}

function afficherOnglets() {
    var c = document.getElementById('cats');
    c.innerHTML = '';
    var toutes = document.createElement('div');
    toutes.className = 'cat-tab' + (CATEGORIE_ACTIVE === 'toutes' ? ' active' : '');
    toutes.textContent = '📚 Toutes';
    toutes.onclick = function() { CATEGORIE_ACTIVE = 'toutes'; sauverSection(); afficherOnglets(); afficherListe(); };
    c.appendChild(toutes);
    CATALOGUE.categories.forEach(function(cat) {
        var t = document.createElement('div');
        t.className = 'cat-tab' + (CATEGORIE_ACTIVE === cat.id ? ' active' : '');
        t.textContent = cat.icone + ' ' + cat.nom;
        t.onclick = function() { CATEGORIE_ACTIVE = cat.id; sauverSection(); afficherOnglets(); afficherListe(); };
        c.appendChild(t);
    });
}

function matchRecherche(c) {
    if (!recherche) return true;
    return c.titre.toLowerCase().indexOf(recherche) !== -1 ||
           c.description.toLowerCase().indexOf(recherche) !== -1;
}

async function afficherListe() {
    var liste = document.getElementById('liste');
    liste.innerHTML = '';
    var coursAffichables = [];
    CATALOGUE.categories.forEach(function(cat) {
        if (CATEGORIE_ACTIVE !== 'toutes' && CATEGORIE_ACTIVE !== cat.id) return;
        cat.cours.forEach(function(c) {
            if (matchRecherche(c)) coursAffichables.push(c);
        });
    });
    if (coursAffichables.length === 0) {
        liste.innerHTML = '<p class="empty">Aucun cours trouvé.</p>';
        return;
    }
    for (var i = 0; i < coursAffichables.length; i++) {
        liste.appendChild(await creerCoursElement(coursAffichables[i]));
    }
}

async function creerCoursElement(c) {
    var localV = await CoursStorage.getVersion(c.id);
    var htmlFile = c.fichiers[0];
    var dejaLa = await CoursStorage.exists(htmlFile);
    var telechargement = telechargementsEnCours[c.id];
    var enCours = !!telechargement;
    var online = navigator.onLine;

    var etatTexte = '', etatCls = '';
    if (enCours) { etatTexte = '⏳ ' + telechargement.done + '/' + telechargement.total; etatCls = 'maj'; }
    else if (!dejaLa) { etatTexte = online ? 'Non téléchargé' : '⚠ Hors ligne'; etatCls = online ? '' : 'warn'; }
    else if (c.version > localV) { etatTexte = 'Mise à jour dispo'; etatCls = 'maj'; }
    else { etatTexte = '✓ Hors ligne'; etatCls = 'ok'; }

    var div = document.createElement('div');
    div.className = 'cours';
    div.innerHTML =
        '<div class="ico">' + (c.icone || '📖') + '</div>' +
        '<div class="info">' +
            '<div class="titre">' + c.titre + '</div>' +
            '<div class="desc">' + c.description + '</div>' +
            '<div class="meta">' +
                '<span class="niveau">' + (c.niveau || '') + '</span>' +
                '<span>⏱ ' + (c.duree || '') + '</span>' +
            '</div>' +
            '<div class="etat ' + etatCls + '">' + etatTexte + '</div>' +
        '</div><div class="actions"></div>';

    var actions = div.querySelector('.actions');
    if (dejaLa && !enCours) {
        var b1 = document.createElement('button');
        b1.className = 'btn-lire'; b1.textContent = '📖 Lire';
        b1.onclick = function() { ouvrirLocal(c); }; actions.appendChild(b1);
        var b2 = document.createElement('button');
        b2.className = 'btn-supp'; b2.textContent = '🗑️';
        b2.onclick = function() { supprimer(c); }; actions.appendChild(b2);
    }
    if (!dejaLa && online && !enCours) {
        var b3 = document.createElement('button');
        b3.className = 'btn-dl'; b3.textContent = '☁️ Télécharger';
        b3.onclick = function() { telecharger(c); }; actions.appendChild(b3);
        var b4 = document.createElement('button');
        b4.className = 'btn-ligne'; b4.textContent = '🌐 En ligne';
        b4.onclick = function() { window.location.href = BASE_URL + c.fichiers[0]; }; actions.appendChild(b4);
    }
    if (dejaLa && c.version > localV && online && !enCours) {
        var b5 = document.createElement('button');
        b5.className = 'btn-maj'; b5.textContent = '🔄 MàJ';
        b5.onclick = function() { telecharger(c); }; actions.appendChild(b5);
    }
    return div;
}

/* ═══════════ RECHERCHE ═══════════ */
function filtrer() {
    recherche = document.getElementById('search').value.toLowerCase().trim();
    afficherListe();
}

/* ═══════════ TÉLÉCHARGEMENT ═══════════ */
async function telecharger(c) {
    if (!navigator.onLine) { setProgress('⚠ Pas de connexion', 'err'); return; }
    if (telechargementsEnCours[c.id]) return;
    telechargementsEnCours[c.id] = { total: c.fichiers.length, done: 0 };
    setProgress('⏳ ' + c.titre + ' : 0/' + c.fichiers.length, '');
    afficherListe();
    for (var i = 0; i < c.fichiers.length; i++) {
        var ok = await CoursStorage.download(BASE_URL + c.fichiers[i], c.fichiers[i]);
        if (ok) onDownloadDone(c.fichiers[i]); else onDownloadError(c.fichiers[i]);
    }
}

function onDownloadDone(f) {
    if (!CATALOGUE) return;
    CATALOGUE.categories.forEach(function(cat) {
        cat.cours.forEach(function(c) {
            if (c.fichiers.indexOf(f) !== -1 && telechargementsEnCours[c.id]) {
                var t = telechargementsEnCours[c.id]; t.done++;
                if (t.done >= t.total) {
                    CoursStorage.setVersion(c.id, c.version);
                    delete telechargementsEnCours[c.id];
                    setProgress('✓ ' + c.titre + ' téléchargé', 'ok');
                } else setProgress('⏳ ' + c.titre + ' : ' + t.done + '/' + t.total, '');
                afficherListe();
            }
        });
    });
}

function onDownloadError(f) {
    if (!CATALOGUE) return;
    CATALOGUE.categories.forEach(function(cat) {
        cat.cours.forEach(function(c) {
            if (c.fichiers.indexOf(f) !== -1 && telechargementsEnCours[c.id]) {
                delete telechargementsEnCours[c.id];
                setProgress('❌ Erreur : ' + f, 'err');
                afficherListe();
            }
        });
    });
}

/* ═══════════ LECTURE / SUPPRESSION ═══════════ */
async function ouvrirLocal(c) {
    var url = BASE_URL + c.fichiers[0];
    try { await CoursStorage.setVersion(c.id, c.version); } catch(e) {}
    track('studia_open', { cours_id: c.id, cours_titre: c.titre });

    var o = document.createElement('div');
    o.id = 'readerOverlay';
    o.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#0d1117;display:flex;flex-direction:column;';
    o.innerHTML =
        '<div style="padding:12px;background:#161b22;border-bottom:1px solid #21262d;display:flex;align-items:center;gap:10px;flex-shrink:0;">' +
            '<button id="closeReader" style="padding:8px 16px;background:#00ff88;color:#121212;border:none;border-radius:20px;font-weight:bold;cursor:pointer;font-size:14px;">← Retour</button>' +
            '<span style="font-size:14px;font-weight:bold;color:#e6f1ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + c.titre + '</span>' +
        '</div>' +
        '<iframe id="readerFrame" style="flex:1;border:none;background:#fff;width:100%;" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>';
    document.body.appendChild(o);

    var frame = o.querySelector('#readerFrame');
    try {
        var cache = await caches.open(CoursStorage.COURS_CACHE);
        var resp = await cache.match(url, { ignoreSearch: true });
        if (!resp) { resp = await fetch(url); if (resp.ok) await cache.put(url, resp.clone()); }
        var html = await resp.text();
        if (!/<base\s/i.test(html)) html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + BASE_URL + '">');
        frame.srcdoc = html;
    } catch(e) {
        frame.srcdoc = '<html><body style="padding:20px;font-family:sans-serif;"><h2>❌ Indisponible</h2><p>Connecte-toi pour télécharger ce cours.</p></body></html>';
    }
    o.querySelector('#closeReader').onclick = function() { o.remove(); };
}

async function supprimer(c) {
    for (var i = 0; i < c.fichiers.length; i++) await CoursStorage.delete(c.fichiers[i]);
    await CoursStorage.setVersion(c.id, 0);
    setProgress('🗑️ ' + c.titre + ' supprimé', '');
    afficherListe();
}

/* ═══════════ ÉVÉNEMENTS ═══════════ */
window.addEventListener('online', function() { setProgress('✓ Connecté', 'ok'); charger(); });
window.addEventListener('offline', function() { setProgress('⚠ Hors ligne', ''); afficherListe(); });

/* ═══════════ DÉCOUVERTES ═══════════ */
async function ouvrirDecouvertes() {
    document.getElementById('decouvertesOverlay').style.display = 'block';
    track('studia_decouvertes');
    await chargerPromos();
}
function fermerDecouvertes() { document.getElementById('decouvertesOverlay').style.display = 'none'; }

async function chargerPromos() {
    var liste = document.getElementById('promosListe');
    liste.innerHTML = '<p style="color:#666;text-align:center;padding:30px;">Chargement...</p>';
    try {
        var cache = await caches.open(PROMOS_CACHE);
        var resp = await cache.match(PROMOS_URL, { ignoreSearch: true });
        if (!resp) {
            resp = await fetch(PROMOS_URL, { cache: 'no-store' });
            if (resp.ok) await cache.put(PROMOS_URL, resp.clone());
        }
        var data = await resp.json();
        afficherPromos(data.promos);
    } catch (e) {
        liste.innerHTML = '<p style="color:#666;text-align:center;padding:30px;">Hors ligne — reviens plus tard.</p>';
    }
}

function afficherPromos(promos) {
    var liste = document.getElementById('promosListe'); liste.innerHTML = '';
    var maintenant = new Date().toISOString().split('T')[0];
    var actifs = promos
        .filter(p => p.paye && p.debut <= maintenant && p.fin >= maintenant &&
                    (!p.cible || p.cible === APP_SOURCE || p.cible === 'toutes'))
        .sort((a, b) => (a.priorite || 99) - (b.priorite || 99));

    if (actifs.length === 0) {
        liste.innerHTML = '<p style="color:#666;text-align:center;padding:30px;">Aucune recommandation.</p>';
        return;
    }
    var badge = document.getElementById('badgePromos');
    if (badge) { badge.textContent = actifs.length; badge.style.display = 'flex'; }

    actifs.forEach(p => {
        var lienTrack = p.lien + (p.lien.indexOf('?') !== -1 ? '&' : '?') +
            'utm_source=' + APP_SOURCE + '&utm_medium=app&utm_campaign=' + (p.id || 'promo');
        var div = document.createElement('div');
        div.className = 'promo-card';
        var badgeHtml = p.partenaire ? '<span class="promo-badge">Partenaire</span>' : '';
        div.innerHTML =
            '<div class="promo-head">' +
                '<div class="promo-ico">' + (p.image ? '<img src="' + p.image + '" alt="" loading="lazy">' : (p.icone || '📌')) + '</div>' +
                '<div class="promo-body">' +
                    '<div class="promo-titre">' + p.titre + badgeHtml + '</div>' +
                    '<div class="promo-desc">' + p.desc + '</div>' +
                    '<div class="promo-meta">' + (p.categorie || '') + (p.ville ? ' • ' + p.ville : '') + '</div>' +
                    '<a href="' + lienTrack + '" target="_blank" rel="noopener" class="promo-lien">Découvrir →</a>' +
                '</div>' +
            '</div>';
        liste.appendChild(div);
    });
}

async function verifierBadgePromos() {
    try {
        var cache = await caches.open(PROMOS_CACHE);
        var resp = await cache.match(PROMOS_URL, { ignoreSearch: true });
        if (!resp) {
            resp = await fetch(PROMOS_URL, { cache: 'no-store' });
            if (resp.ok) await cache.put(PROMOS_URL, resp.clone());
        }
        var data = await resp.json();
        var maintenant = new Date().toISOString().split('T')[0];
        var count = data.promos.filter(p => p.paye && p.debut <= maintenant && p.fin >= maintenant &&
                    (!p.cible || p.cible === APP_SOURCE || p.cible === 'toutes')).length;
        var badge = document.getElementById('badgePromos');
        if (badge && count > 0) { badge.textContent = count; badge.style.display = 'flex'; }
    } catch (e) {}
}

/* ═══════════ TRACKING ═══════════ */
function track(nom, params) { if (typeof gtag === 'function') gtag('event', nom, params || {}); }
track('studia_app_open', { version: '1.0.0', pwa: window.matchMedia('(display-mode: standalone)').matches });

var _oldDownload = telecharger;
telecharger = function(c) {
    track('studia_download', { cours_id: c.id, cours_titre: c.titre, fichiers: c.fichiers.length });
    return _oldDownload.call(this, c);
};
var _oldSupprimer = supprimer;
supprimer = function(c) {
    track('studia_delete', { cours_id: c.id });
    return _oldSupprimer.call(this, c);
};
var _oldFiltrer = filtrer;
filtrer = function() {
    var r = document.getElementById('search').value;
    if (r && r.length > 2) track('studia_search', { search_term: r });
    return _oldFiltrer.call(this);
};
window.addEventListener('click', function(e) {
    var lien = e.target.closest('.promo-lien');
    if (lien) {
        var card = lien.closest('.promo-card');
        var titre = card ? card.querySelector('.promo-titre').textContent : '';
        track('studia_promo_click', { promo: titre });
    }
});
window.addEventListener('appinstalled', function() { track('studia_pwa_install'); });

/* ═══════════ DÉMARRAGE ═══════════ */
verifierBadgePromos();
charger();
</script>
