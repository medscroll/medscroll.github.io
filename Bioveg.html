<script>
    // ==================== 42 SLIDES (cours biologie végétale) ====================
    const slides = [
        { title: "Introduction à la Biologie Végétale", content: `<p><strong>Biologie</strong> (grec <em>bios</em> = vie, <em>logos</em> = science) : étude des êtres vivants. La vie se caractérise par une organisation complexe, le métabolisme, la reproduction et l'adaptation.</p>
        <div class="definition">📌 <strong>Objet de la Biologie végétale :</strong> description de la forme, structure, fonctions et cycles des végétaux, ainsi que leurs relations avec le milieu.</div>
        <p>Un être vivant se distingue de la matière inerte par :<br> - Organisation cellulaire<br> - Métabolisme (anabolisme + catabolisme)<br> - Reproduction (naissance, croissance, mort)<br> - Équilibre dynamique</p>
        <p><em>« Omne vivum e vivo »</em> — tout être vivant provient d'un être préexistant.</p>` },
        { title: "Distinction Végétal / Animal", content: `<h3>Principales différences</h3>
        <ul><li><strong>Nutrition</strong> : Végétaux → autotrophes (photosynthèse) ; Animaux → hétérotrophes.</li>
        <li><strong>Motilité</strong> : Animaux mobiles (muscles/nerfs) ; Végétaux peu mobiles (vacuoles, paroi rigide).</li>
        <li><strong>Croissance</strong> : Végétaux croissance illimitée (méristèmes) ; Animaux croissance limitée.</li></ul>
        <div class="info-card">⚠️ Exception : champignons sont hétérotrophes, autrefois classés parmi végétaux.</div>
        <p>Les cellules végétales possèdent paroi pectocellulosique, chloroplastes, vacuoles turgescentes.</p>` },
        { title: "Types cellulaires et niveaux d'organisation", content: `<p><strong>Unicellulaires</strong> : levure, amibe.<br> <strong>Pluricellulaires</strong> : homme, avocatier.</p>
        <h4>Structures intermédiaires</h4>
        <ul><li><strong>Symplastique</strong> : plasmode plurinucléé (Myxomycètes, Vaucheria).</li>
        <li><strong>Articulaire</strong> : plusieurs compartiments (Cladophora).</li>
        <li><strong>Colonie / Coenobie</strong> : association constante (Pediastrum 16 cellules, Scenedesmus 4 cellules).</li>
        <li><strong>Volvox</strong> : cas limite entre colonie et individu pluricellulaire.</li></ul>` },
        { title: "Procaryotes vs Eucaryotes", content: `<div class="definition">🔬 <strong>Procaryotes</strong> : pas de noyau, ADN circulaire, pas d'organites membranaires, ribosomes 70S. Ex: Bactéries, cyanobactéries.</div>
        <div class="definition">🧬 <strong>Eucaryotes</strong> : noyau avec enveloppe, chromosomes ADN+histones, mitose, organites (mitochondries, chloroplastes), flagelles 9+2.</div>
        <p>Règnes eucaryotes : Protistes, Végétaux, Champignons, Animaux.</p>` },
        { title: "Règne des Protistes", content: `<p>Protistes unicellulaires majoritairement, comprennent Protozoaires (tendance animale) et Algues (tendance végétale). Phytoplancton = base chaîne alimentaire. Ex: <em>Euglena, Chlamydomonas, Diatomées</em>.</p>
        <p>Zooplancton : animaux microscopiques, larves, protistes hétérotrophes.</p>` },
        { title: "Classification des Végétaux (grands groupes)", content: `<ul><li><strong>Spermatophytes</strong> (plantes à graines) : racines, tige, feuilles, graines.</li><li><strong>Ptéridophytes</strong> (fougères) : appareil végétatif complet, dissémination par spores.</li><li><strong>Bryophytes</strong> (mousses) : tige+feuilles, pas de racines, spores.</li><li><strong>Thallophytes</strong> (algues, champignons) : thalle sans racines/tige/feuilles.</li></ul>` },
        { title: "Spermatophytes : Gymnospermes / Angiospermes", content: `<p><strong>Gymnospermes</strong> : graines nues (ex: <em>Encephalartos, Gnetum africanum</em>, pins).<br> <strong>Angiospermes</strong> : graines dans un ovaire clos.</p>
        <h4>Monocotylédones</h4> <p>1 cotylédon (maïs, palmier).</p>
        <h4>Dicotylédones</h4> <p>2 cotylédons (haricot, ricin).</p>
        <p>Structure de la graine : tégument (spermoderme), embryon (radicule, tigelle, cotylédons), réserves (albumen ou cotylédons).</p>` },
        { title: "Virus : entités non cellulaires", content: `<div class="warning">🦠 <strong>Virus</strong> : complexes macromoléculaires (ADN/ARN + protéines), parasites intracellulaires obligatoires. Ils ne sont pas considérés comme vivants au sens strict car ne se répliquent pas seuls.</div>
        <p>Exemples pathogènes humains : grippe, SIDA (VIH), COVID-19, hépatite. Bactériophages (phages) utiles en biologie moléculaire.</p>` },
        { title: "Disciplines de la botanique", content: `<ul><li><strong>Morphologie</strong> : formes externe (organographie) et interne (anatomie).</li><li><strong>Histologie</strong> : étude des tissus.</li><li><strong>Cytologie</strong> : étude de la cellule.</li><li><strong>Physiologie</strong> : fonctions végétales.</li><li><strong>Systématique</strong> : classification, nomenclature.</li><li><strong>Écologie, Phytosociologie, Phytogéographie, Phytopathologie, Biotechnologies.</strong></li></ul>` },
        { title: "Microscopie optique et électronique", content: `<p><strong>Microscope optique</strong> : résolution ~0,2 µm, grossissement 1500x. Coloration hématoxyline-éosine, etc.</p>
        <p><strong>Microscope électronique à transmission (MET)</strong> : électrons, résolution 0,001 µm, observe ultrastructure (mitochondries, membranes).</p>
        <div class="info-card">🔬 Microscopes spéciaux : contraste de phase, fluorescence, polarisant, interférentiel.</div>` },
        { title: "Constituants biochimiques de la cellule végétale", content: `<p><strong>Minéraux</strong> : eau (75% masse végétale), sels minéraux (K, Ca, Mg, phosphates).<br> <strong>Organiques</strong> : glucides, lipides, protides, acides nucléiques.</p>
        <p>Rôle des ions : équilibre osmotique, cofacteurs enzymatiques, structure (Mg dans chlorophylle, Fe dans cytochromes).</p>` },
        { title: "Protéines et acides aminés", content: `<p>Protéines = polymères d’acides aminés (20 standards). Liaison peptidique. Holoprotéines (uniquement AA) et hétéroprotéines (groupement prosthétique).</p>
        <p>Structure primaire → secondaire → tertiaire → quaternaire. Protéines fibreuses (collagène) et globulaires (enzymes).</p>` },
        { title: "Glucides : Oses et Osides", content: `<p><strong>Oses</strong> : sucres simples (glucose, fructose, ribose).<br> <strong>Osides</strong> : holosides (amidon, cellulose, glycogène) et hétérosides (anthocyanes, hétérosides cyanogénétiques).</p>
        <p>Amidon : mélange amylose/amylopectine, réserve végétale. Cellulose : polymère β-glucose, paroi végétale.</p>` },
        { title: "Lipides", content: `<p>Lipides saponifiables (glycérides, phospholipides, sphingolipides) et non saponifiables (stéroïdes, caroténoïdes).<br> Rôles : énergétique, structure membranaire, hormones, vitamines liposolubles (A, D, E, K).</p>
        <p>Acides gras essentiels (oméga-3/6).</p>` },
        { title: "Acides nucléiques (ADN, ARN)", content: `<p>ADN : double hélice, bases A-T, G-C, support de l’hérédité. ARN : simple brin, ribose, uracile.<br> Nucléotides : base + pentose + phosphate. Rôle dans stockage, expression et transmission de l'information génétique.</p>` },
        { title: "Structure générale de la cellule végétale", content: `<p>Paroi pectocellulosique, plasmalemme, cytoplasme, noyau, vacuole centrale, plastes (chloroplastes, chromoplastes, amyloplastes).</p>
        <div class="definition">🔍 <strong>Particularités végétales</strong> : paroi rigide, plasmodesmes, vacuole de turgescence, présence de chlorophylle.</div>` },
        { title: "Membrane plasmique et hyaloplasme", content: `<p>Membrane unitaire (7,5-10 nm), bicouche lipidique + protéines, perméabilité sélective.<br> Hyaloplasme = cytosol, milieu colloïdal où baignent organites, riche en eau et enzymes.</p>` },
        { title: "Réticulum endoplasmique, ribosomes, Golgi", content: `<p><strong>RER</strong> : ribosomes, synthèse protéique. <strong>REL</strong> : lipides, détoxication.<br> <strong>Appareil de Golgi</strong> : modification, tri, sécrétion de polysaccharides (pectines).</p>` },
        { title: "Mitochondries et plastes", content: `<p><strong>Mitochondries</strong> : production ATP (respiration). ADN propre, double membrane, crêtes.<br> <strong>Chloroplastes</strong> : photosynthèse, thylakoïdes, chlorophylle, stroma, ADN circulaire.<br> <strong>Amyloplastes</strong> : stockage amidon.</p>` },
        { title: "Paroi végétale et plasmodesmes", content: `<p>Lamelle moyenne (pectines), paroi primaire (cellulose, hémicellulose), paroi secondaire (lignine). Plasmodesmes = communications cytoplasmiques → symplasme.<br> Rôles : soutien, protection, transport, signalisation.</p>` },
        { title: "Noyau, chromatine, mitose", content: `<p>Noyau : enveloppe nucléaire poreuse, nucléole (ARNr), chromatine (ADN+histones). Mitose : prophase, métaphase, anaphase, télophase → maintien 2n.<br> Interphase (G1, S, G2).</p>` },
        { title: "Méiose et reproduction sexuée", content: `<p>Méiose : deux divisions successives → réduction du nombre chromosomique (2n→n). Appariement des homologues, crossing-over, brassage génétique.<br> Importance : variabilité, évolution.</p>` },
        { title: "Cycle cellulaire et phases", content: `<p>Cycle : G1 (croissance), S (réplication ADN), G2, M (mitose). Régulation par cyclines/CDK. Point de contrôle G1/S.</p>` },
        { title: "Tissus végétaux : méristèmes", content: `<p><strong>Méristèmes primaires</strong> (apex tige/racine) → élongation. <strong>Méristèmes secondaires</strong> (cambium) → épaississement.<br> Cellules isodiamétriques, petites vacuoles, forte activité mitotique.</p>` },
        { title: "Tissus de revêtement, parenchymes", content: `<p>Épiderme (cuticule, stomates), suber (liège). Parenchyme : palissadique (photosynthèse), lacuneux (échanges gazeux), de réserve (amidon).</p>` },
        { title: "Tissus conducteurs : xylème et phloème", content: `<p><strong>Xylème</strong> (bois) : vaisseaux, trachéides → sève brute ascendante (eau + sels).<br> <strong>Phloème</strong> (liber) : tubes criblés, cellules compagnes → sève élaborée (sucres).</p>` },
        { title: "Racine : anatomie et fonctions", content: `<p>Racine : coiffe, zone pilifère (poils absorbants), endoderme (bande de Caspary), cylindre central.<br> Fonctions : ancrage, absorption eau/sels, stockage.</p>` },
        { title: "Tige : organisation et métamérisation", content: `<p>Tige : nœuds, entre-nœuds, bourgeons axillaires. Tissus : épiderme, parenchyme cortical, faisceaux criblo-vasculaires (disposition variable selon monocot/dicot).</p>` },
        { title: "Feuille : structure et adaptations", content: `<p>Limbe, pétiole, gaine. Épiderme supérieur, parenchyme palissadique, parenchyme lacuneux, nervures (faisceaux), stomates (face inférieure). Adaptation photosynthétique.</p>` },
        { title: "Fleur et reproduction des angiospermes", content: `<p>Pédoncule, réceptacle, sépales (calice), pétales (corolle), étamines (androcée), carpelles (gynécée). Pollinisation (anémophile, entomophile) → double fécondation : œuf (2n) + albumen (3n).</p>` },
        { title: "Fruit et graine", content: `<p>Fruit : transformation de l'ovaire. Types : charnu (baie, drupe) ou sec (akène, gousse, caryopse). Graine : tégument, embryon (cotylédons, radicule), réserves (albumen ou cotylédons).</p>` },
        { title: "Photosynthèse - phase lumineuse", content: `<p>Photolyse de l’eau, production O₂, ATP et NADPH. Pigments chlorophylliens (a, b), caroténoïdes. Localisation : thylakoïdes des chloroplastes.</p>` },
        { title: "Photosynthèse - cycle de Calvin", content: `<p>Fixation du CO₂ via Rubisco, production de glucides (amidon, saccharose). Utilisation ATP/NADPH issus de la phase claire.</p>` },
        { title: "Respiration cellulaire végétale", content: `<p>Glycolyse (cytosol) → pyruvate → cycle de Krebs (mitochondrie) → chaîne respiratoire → ATP. Quotient respiratoire CO₂/O₂ variable selon substrat.</p>` },
        { title: "Perméabilité et osmose chez les plantes", content: `<p>Pression osmotique, turgescence, plasmolyse. Force de succion (DPD = PO - Pm). Voies apoplasmique et symplasmique pour le transport.</p>` },
        { title: "Transport membranaire : diffusion, actif, endocytose", content: `<p>Diffusion simple (eau, O₂, CO₂). Transport facilité (canaux). Transport actif (ATP, pompes). Endocytose/exocytose rares chez végétaux.</p>` },
        { title: "Classification : Algues (Thallophytes)", content: `<p>Algues vertes (Chlorophytes), rouges (Rhodophytes), brunes (Phéophytes). Diatomées (Bacillariophycées). Rôle écologique majeur (phytoplancton).</p>` },
        { title: "Champignons (Mycobiontes)", content: `<p>Eumycètes : Phycomycètes, Ascomycètes (levures, Penicillium), Basidiomycètes (champignons à chapeau). Mycélium d’hyphes. Hétérotrophes (saprophytes ou parasites).</p>` },
        { title: "Bryophytes (mousses)", content: `<p>Gamétophyte dominant, sporophyte parasite. Reproduction dépendante de l’eau. Ex: <em>Marchantia</em>, <em>Polytrichum</em>. Absence de vaisseaux.</p>` },
        { title: "Ptéridophytes (fougères)", content: `<p>Sporophyte dominant, feuilles (frondes), sporanges (sori). Gamétophyte indépendant (prothalle). Ex: <em>Polypodium</em>, <em>Azolla</em> (symbiose avec Anabaena).</p>` },
        { title: "Gymnospermes et Angiospermes comparés", content: `<p>Gymnospermes : ovules nus, pas de fleur vraie, bois souvent résineux (pins, cyprès). Angiospermes : fleurs, ovules dans ovaire, fruits, diversification majeure.</p>` },
        { title: "Hérédité mendélienne appliquée aux plantes", content: `<p>Lois de Mendel (uniformité F1, ségrégation 3:1, indépendance). Dominance, dihybridisme. Exemple pois : couleur fleur, forme graine. Génotype vs phénotype.</p>` },
        { title: "Conclusion : importance de la botanique médicale", content: `<p>La botanique fournit des principes actifs (digitoxine, morphine, antipaludéens), éclaire les mécanismes écologiques et évolutifs. Indispensable pour comprendre les pathologies végétales, les ressources pharmacologiques et les interactions homme-plantes.</p>
        <div class="definition">🌱 <strong>Message clé</strong> : La cellule végétale, par sa plasticité et sa biochimie unique, est au fondement de la vie terrestre et de la médecine moderne.</div>` }
    ];

    function initDummyAudio() {
        // Pour permettre affichage temps, on utilise un objet Audio sans source
        // Mais si l'utilisateur veut un vrai fichier, il peut ajouter "audio_botanique.mp3" et le script l'utilisera.
        // On préfère donner le choix : on vérifie si un fichier audio existe, sinon on crée un élément silencieux.
        audio.src = ""; // vide, pas d'audio par défaut.
        // Mais on permet de charger manuellement via la console ou en déposant un fichier "cours_botanique.mp3".
        // Par simplicité, on crée un mode sans audio réel mais avec minuteur factice pour la lecture auto.
        // Pour la cohérence, on simule une piste audio factice (bruit blanc silencieux).
        try {
            // On peut créer un AudioContext factice mais inutile. On va juste définir currentTime virtuel.
            // On utilise setInterval pour simuler le temps en lecture auto.
        } catch(e) {}
    }

    function renderSlide(index) {
        const slide = slides[index];
        contentDiv.innerHTML = `<div class="slide active"><h2 class="slide-title">${escapeHtml(slide.title)}</h2><div class="slide-content">${slide.content}</div></div>`;
        slideCounterSpan.innerText = `${index+1}/${slides.length}`;
        if (!isAuto) {
            prevBtn.disabled = (index === 0);
            nextBtn.disabled = (index === slides.length-1);
        }
        contentDiv.scrollTop = 0;
        updateProgressFromTime(audio.currentTime);
    }

    function escapeHtml(str) { return str; } // content déjà safe, mais simple.

    function updateProgressFromTime(sec) {
        let percent = (sec / totalDuration) * 100;
        if (percent > 100) percent = 100;
        progressFill.style.width = `${percent}%`;
        let mins = Math.floor(sec/60);
        let secs = Math.floor(sec%60);
        let totalM = Math.floor(totalDuration/60);
        let totalS = Math.floor(totalDuration%60);
        timeDisplay.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')} / ${totalM.toString().padStart(2,'0')}:${totalS.toString().padStart(2,'0')}`;
    }

    function syncSlideFromAudioTime() {
        if (!isAuto) return;
        let current = audio.currentTime;
        for (let i = timelineSec.length-1; i >= 0; i--) {
            if (current >= timelineSec[i]) {
                if (i !== currentSlide) {
                    currentSlide = i;
                    renderSlide(currentSlide);
                }
                break;
            }
        }
        updateProgressFromTime(current);
        if (current >= totalDuration-1) stopAutoPlay();
    }

    function startAutoPlay() {
        if (audio.src === "" || !audio.src) {
            // Si aucun fichier audio n'est fourni, on crée un flux "synthétique" en incrémentant le temps
            // On va simuler un timer pour la lecture auto.
            if (!audio.src || audio.src === window.location.href || audio.src === "") {
                // Pas de vrai fichier : on crée un Blob audio silencieux pour pouvoir utiliser currentTime
                const silentBlob = new Blob([], {type: 'audio/mp3'});
                const fakeUrl = URL.createObjectURL(silentBlob);
                audio.src = fakeUrl;
                audio.load();
            }
        }
        isAuto = true;
        autoBtn.innerText = "⏸ Pause";
        autoBtn.classList.remove('play-btn');
        autoBtn.classList.add('stop-btn');
        statusSpan.innerText = "🎧 Lecture automatique (synchro)";
        statusSpan.style.background = "#1d4533dd";
        prevBtn.disabled = true;
        nextBtn.disabled = true;
        audio.play().catch(e => console.log("audio play bloqué, mode simulé"));
        if (syncInterval) clearInterval(syncInterval);
        syncInterval = setInterval(syncSlideFromAudioTime, 280);
    }

    function stopAutoPlay() {
        isAuto = false;
        autoBtn.innerText = "🎧 Lecture automatique";
        autoBtn.classList.remove('stop-btn');
        autoBtn.classList.add('play-btn');
        statusSpan.innerText = "📖 Navigation manuelle";
        statusSpan.style.background = "#1a2c24dd";
        audio.pause();
        if (syncInterval) { clearInterval(syncInterval); syncInterval = null; }
        prevBtn.disabled = (currentSlide === 0);
        nextBtn.disabled = (currentSlide === slides.length-1);
    }

    function toggleAuto() {
        if (isAuto) stopAutoPlay();
        else startAutoPlay();
    }

    function nextSlide() { if (!isAuto && currentSlide < slides.length-1) { currentSlide++; renderSlide(currentSlide); } }
    function prevSlide() { if (!isAuto && currentSlide > 0) { currentSlide--; renderSlide(currentSlide); } }

    // Gestion audio: si le temps change manuellement (curseur) on peut synchroniser
    audio.addEventListener('timeupdate', () => {
        if (!isAuto) updateProgressFromTime(audio.currentTime);
    });
    audio.addEventListener('ended', () => { if(isAuto) stopAutoPlay(); });

    // Navigation clavier
    document.addEventListener('keydown', (e) => {
        if (isAuto) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
        else if (e.key === ' ' || e.key === 'Space') { e.preventDefault(); toggleAuto(); }
    });

    prevBtn.onclick = prevSlide;
    nextBtn.onclick = nextSlide;
    autoBtn.onclick = toggleAuto;

    // Initialisation
    renderSlide(0);
    // initialisation audio silencieuse pour éviter erreurs
    const silentAudio = () => {
        if (!audio.src) {
            const blob = new Blob([], {type: 'audio/mp3'});
            audio.src = URL.createObjectURL(blob);
        }
        audio.load();
        audio.currentTime = 0;
        updateProgressFromTime(0);
    };
    silentAudio();
    // timer pour actualiser l'affichage si audio non joué
    setInterval(() => {
        if (!isAuto) updateProgressFromTime(audio.currentTime);
    }, 500);
</script>
</body>
</html>
